<div class="gestion-partie-container">
  <bouton-retour></bouton-retour>
  <h2 class="champ">Gestion des parties</h2>
  <button class="btn" (click)="openCreationPartieDialog()">
    <mat-icon>add</mat-icon>Créer une nouvelle partie
  </button>
  <div class="table-wrapper">
    <table mat-table [dataSource]="allParties()">
      <ng-container matColumnDef="nomPartie">
        <th mat-header-cell *matHeaderCellDef>Nom de la partie</th>
        <td mat-cell *matCellDef="let partie">{{ partie.nomPartie }}</td>
      </ng-container>

      <ng-container matColumnDef="questions">
        <th mat-header-cell *matHeaderCellDef>Questions</th>
        <td mat-cell *matCellDef="let partie">
          <div>{{ partie.listeQuestions[0].question }}</div>
          <div>{{ partie.listeQuestions[1].question }}</div>
          <div>
            <a href="/admin/question?idPartie={{ partie.id }}" target="_blank"
              ><mat-icon>visibility</mat-icon>Voir les autres questions</a
            >
          </div>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </div>
</div>
