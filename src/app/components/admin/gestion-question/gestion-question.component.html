<div class="gestion-question-container">
  <bouton-retour></bouton-retour>
  <h2 class="champ">Gestion des questions</h2>
  <div class="actions-container">
    <button class="btn" [matMenuTriggerFor]="newQuestionsMenu">
      <mat-icon>add</mat-icon> Créer de nouvelles questions ...
    </button>
    <mat-menu #newQuestionsMenu>
      <button mat-menu-item (click)="openAddDialog()">Unitairement</button>
      <button mat-menu-item (click)="openImportQuestionsDialog()">Par import de fichier</button>
    </mat-menu>
    <filtrage-question
      [idPartieFromUrl]="idPartieFromUrl()"
      (onFiltreValueChange)="updateFiltre($event)"
    ></filtrage-question>
  </div>
  <div class="table-wrapper">
    <table mat-table matSort [dataSource]="allQuestions()">
      <ng-container matColumnDef="question">
        <th mat-header-cell *matHeaderCellDef>Question</th>
        <td mat-cell *matCellDef="let question">{{ question.question }}</td>
      </ng-container>

      <ng-container matColumnDef="annee">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Année</th>
        <td mat-cell *matCellDef="let question">{{ question.annee }}</td>
      </ng-container>

      <ng-container matColumnDef="image">
        <th mat-header-cell *matHeaderCellDef>Image</th>
        <td mat-cell *matCellDef="let question"><img src="{{ question.image }}" /></td>
      </ng-container>

      <ng-container matColumnDef="musique">
        <th mat-header-cell *matHeaderCellDef>Extrait musical</th>
        <td mat-cell *matCellDef="let question">
          @if (question.musique) {
            <mat-icon class="extrait-playable" (click)="playExtrait(question.musique)"
              >volume_up</mat-icon
            >
            @if (nomExtraitEnEcoute() === question.musique) {
              <mat-icon class="extrait-playable" (click)="arreterExtrait()">stop</mat-icon>
            }
          } @else {
            <mat-icon>volume_off</mat-icon>
          }
        </td>
      </ng-container>

      <ng-container matColumnDef="action">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let question">
          <mat-icon class="editable" (click)="openEditDialog(question)">edit</mat-icon>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </div>
</div>
